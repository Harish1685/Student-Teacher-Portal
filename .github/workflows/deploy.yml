name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Build and Push Images
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $DOCKERHUB_USER/frontend:$IMAGE_TAG ./frontend
          docker build -t $DOCKERHUB_USER/backend:$IMAGE_TAG ./backend

          docker push $DOCKERHUB_USER/frontend:$IMAGE_TAG
          docker push $DOCKERHUB_USER/backend:$IMAGE_TAG

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/app"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/app
            cd ~/app

            # docker compose needs these two to work out the image names.
            # writing them to .env (compose reads that file on its own) also means
            # they are still there later if I run compose by hand on the server
            cat > .env <<EOF
            DOCKERHUB_USER=${{ secrets.DOCKERHUB_USER }}
            IMAGE_TAG=${{ github.sha }}
            EOF

            # download the new images first, so the old app keeps running if this fails
            docker compose pull

            # --wait makes this line finish only after the healthchecks pass
            docker compose up -d --remove-orphans --wait --wait-timeout 180

            docker compose ps

            # --wait already proved the backend is healthy, so just check the
            # two things it doesn't cover: nginx serving the page, and /api/
            # reaching the backend through it
            curl -fsS -o /dev/null http://localhost/
            curl -fsS -o /dev/null http://localhost/api/student

            echo "Deploy OK"
