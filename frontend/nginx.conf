server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # React routing
  location / {
    try_files $uri /index.html;
  }

  # anything starting with /api/ goes to the backend container
  # the trailing slash removes /api, so /api/student becomes /student
  location /api/ {
    proxy_pass http://backend:3500/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  error_page 404 /index.html;
}
